app = "lexicon-vocab"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/vocab.db"

[[mounts]]
  source = "vocab_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
